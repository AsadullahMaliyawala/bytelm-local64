[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lct"
version = "0.1.0"
description = "Latent Concept Tokens + Structured World Modeling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.1.0",
  "numpy>=1.24.0",
  "pyyaml>=6.0",
  "tqdm>=4.65.0",
  "datasets>=2.14.0",
  "tokenizers>=0.15.0",
  "sentencepiece>=0.1.99",
  "scikit-learn>=1.3.0",
  "matplotlib>=3.7.0",
  "plotly>=5.18.0",
  "networkx>=3.1",
  "streamlit>=1.28.0",
  "pandas>=2.0.0",
  "einops>=0.7.0",
  "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"